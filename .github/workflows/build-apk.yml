name: Build APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'release/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 复用同一个签名文件，保证新版本可以直接覆盖安装旧版本（仓库中不保存任何私钥）
      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: boxverse-signing-key-v1

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/BoxVerse-v1.0.${{ github.run_number }}.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BoxVerse-APK
          path: out/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 盒宇宙 BOXVERSE v1.0.${{ github.run_number }}
          body: |
            盒宇宙 BOXVERSE 安卓安装包（自动构建）
            分支：${{ github.ref_name }}
            提交：${{ github.sha }}
            下载下方 Assets 中的 .apk 文件，在安卓手机上打开即可安装。
          files: out/*.apk
          make_latest: true

      - name: Commit APK into repository (only when commit message contains [apk])
        if: contains(github.event.head_commit.message, '[apk]')
        run: |
          mkdir -p release
          rm -f release/*.apk
          cp out/*.apk release/BoxVerse-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/BoxVerse-latest.apk
          git commit -m "chore: 更新最新 APK 安装包 (build ${{ github.run_number }})"
          git push
